<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout | AdminHTML</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">

        <div class="w-16 h-16 mx-auto rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl mb-5">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Successfully Logged Out
        </h1>


        <p class="text-slate-500 mb-6">
            You have been successfully logged out of the admin panel.
        </p>


        <a href="login.htm"
           class="inline-block px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl">

            <i class="fa-solid fa-right-to-bracket mr-2"></i>

            Login Again

        </a>

    </div>

</body>

</html>
