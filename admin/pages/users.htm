<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users | AdminHTML</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>


<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <div id="sidebarContainer"></div>


        <div class="flex-1 min-w-0">

            <div id="navbarContainer"></div>


            <main class="p-4 md:p-6 lg:p-8">

                <div id="headerContainer"></div>


                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

                    <div class="p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                        <div>

                            <h2 class="text-lg font-bold">
                                Users
                            </h2>

                            <p class="text-sm text-slate-400">
                                Manage all registered users
                            </p>

                        </div>


                        <button class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-medium hover:bg-indigo-700">

                            <i class="fa-solid fa-plus mr-2"></i>

                            Add User

                        </button>

                    </div>


                    <div class="px-5 pb-5">

                        <div class="overflow-x-auto">

                            <table class="w-full min-w-[700px]">

                                <thead class="bg-slate-50">

                                    <tr>

                                        <th class="text-left px-4 py-3 text-xs text-slate-500 uppercase">
                                            User
                                        </th>

                                        <th class="text-left px-4 py-3 text-xs text-slate-500 uppercase">
                                            Email
                                        </th>

                                        <th class="text-left px-4 py-3 text-xs text-slate-500 uppercase">
                                            Role
                                        </th>

                                        <th class="text-left px-4 py-3 text-xs text-slate-500 uppercase">
                                            Status
                                        </th>

                                        <th class="text-right px-4 py-3 text-xs text-slate-500 uppercase">
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody class="divide-y divide-slate-100">

                                    <tr>

                                        <td class="px-4 py-4">

                                            <div class="flex items-center gap-3">

                                                <img src="https://i.pravatar.cc/100?img=1"
                                                     class="w-9 h-9 rounded-full">

                                                <span class="font-medium">
                                                    John Doe
                                                </span>

                                            </div>

                                        </td>

                                        <td class="px-4 py-4 text-sm text-slate-500">
                                            john@example.com
                                        </td>

                                        <td class="px-4 py-4">
                                            <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full">
                                                Admin
                                            </span>
                                        </td>

                                        <td class="px-4 py-4">
                                            <span class="text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-full">
                                                Active
                                            </span>
                                        </td>

                                        <td class="px-4 py-4 text-right">

                                            <button class="text-slate-400 hover:text-indigo-600 mr-3">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            <button class="text-slate-400 hover:text-red-600">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>

                                        </td>

                                    </tr>


                                    <tr>

                                        <td class="px-4 py-4">

                                            <div class="flex items-center gap-3">

                                                <img src="https://i.pravatar.cc/100?img=5"
                                                     class="w-9 h-9 rounded-full">

                                                <span class="font-medium">
                                                    Sarah Smith
                                                </span>

                                            </div>

                                        </td>

                                        <td class="px-4 py-4 text-sm text-slate-500">
                                            sarah@example.com
                                        </td>

                                        <td class="px-4 py-4">
                                            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                                                User
                                            </span>
                                        </td>

                                        <td class="px-4 py-4">
                                            <span class="text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-full">
                                                Active
                                            </span>
                                        </td>

                                        <td class="px-4 py-4 text-right">

                                            <button class="text-slate-400 hover:text-indigo-600 mr-3">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            <button class="text-slate-400 hover:text-red-600">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <div id="footerContainer"></div>

            </main>

        </div>

    </div>


    <script src="../assets/js/include.js"></script>

    <script src="../assets/js/app.js"></script>

</body>

</html>
